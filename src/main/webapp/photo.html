<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사진 페이지</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      background-color: #f4f4f9;
    }
    header, nav, main, footer {
      margin: 20px auto;
      max-width: 800px;
    }
    nav ul {
      list-style-type: none;
      padding: 0;
    }
    nav ul li {
      display: inline;
      margin: 0 15px;
    }
    nav ul li a {
      text-decoration: none;
      color: #333;
      font-weight: bold;
    }
    nav ul li a:hover {
      color: #007BFF;
    }
    .photo-item {
      margin-top: 40px;
      padding: 20px;
      border: 1px solid #ccc;
      background-color: #fff;
      border-radius: 8px;
      text-align: left;
    }
    .photo-item img {
      width: 180px;
      height: auto;
      display: inline-block;
      margin-right: 20px;
      border: 3px solid #ccc;
      border-radius: 5px;
    }
    .photo-item p {
      font-size: 18px;
      line-height: 1.6;
      color: #333;
      display: inline-block;
      vertical-align: top;
    }
    .photo-divider {
      margin-top: 20px;
      border-top: 2px solid #ccc;
      padding-top: 20px;
    }
    footer {
      text-align: center;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>
<body>
<header>
  <h1>Photo📷</h1>
</header>
<nav>
  <ul>
    <li><a href="/aboutme/index.html">홈</a></li>
    <li><a href="/aboutme/aboutme.html">자기소개</a></li>
    <li><a href="/aboutme/photo.html">내 사진</a></li>
    <li><a href="/aboutme/today">몇시에요</a></li>
  </ul>
</nav>
<main>
  <div class="photo-item">
    <img src="images/kiwi.jpg" alt="사진 1">
    <p>제가 좋아하는 키위새의 모습입니다.</p>
  </div>
  <div class="photo-divider"></div>

  <div class="photo-item">
    <img src="images/real_kiwi.jpg" alt="사진 2">
    <p>키위새는 사실 키위였습니다.</p>
  </div>
  <div class="photo-divider"></div>

  <div class="photo-item">
    <img src="images/real_kiwi_bird.jpg" alt="사진 3">
    <p>이건 진짜 키위새입니다.</p>
  </div>
  <div class="photo-divider"></div>
</main>
<footer>
  <p>&copy; 2025 미니 프로젝트 1</p>
</footer>
</body>
</html>
